openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Sign in, one-time setup and password recovery
  - name: projects
    description: Project management and spending summaries
  - name: currencies
    description: Currency management
  - name: locations
    description: Location management
  - name: backup
    description: Data export and backup management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/state:
    get:
      operationId: getAuthState
      tags: [auth]
      summary: Sign-in state
      description: >
        Tells the web app whether the one-time setup screen is still open and
        whether the current cookie resolves to a live session. Reachable without
        a session so the app can decide which screen to show.
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthState"
  /auth/setup:
    post:
      operationId: setupAccount
      tags: [auth]
      summary: Create the single account
      description: >
        Creates the one account this app supports and signs in. Permanently
        refused with 409 once an account exists, so it cannot be used later to
        add or replace an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAccountRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; sets the session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Email and password do not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: Deletes only the calling session.
      responses:
        "200":
          description: Signed out; clears the session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOk"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: The signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset link
      description: >
        Returns the same message and status whether or not the address is
        registered, so the response cannot be used to discover which addresses
        exist. The reset token is never included in the response; when no email
        provider is configured the link is written to the server log instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Accepted, regardless of whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      description: >
        Validates that the token exists, is unused and has not expired; replaces
        the stored password hash; marks the token used; and revokes every
        session. Unknown, expired and already-used tokens return the same
        response so a token cannot be probed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the password while signed in
      description: >
        Requires the current password. On success the stored hash is replaced
        and every session is revoked, including the one making the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
      responses:
        "200":
          description: Projects with current spending totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A project with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details and spending
      responses:
        "200":
          description: Project details with spending totals and recent expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A project with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/archive:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /currencies:
    get:
      operationId: listCurrencies
      tags: [currencies]
      summary: List currencies
      parameters:
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of currencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currency"
    post:
      operationId: createCurrency
      tags: [currencies]
      summary: Create a currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyInput"
      responses:
        "201":
          description: Created currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          description: Invalid currency data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A currency with this code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /currencies/{currencyId}:
    parameters:
      - name: currencyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCurrency
      tags: [currencies]
      summary: Update a currency (enable/disable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyUpdate"
      responses:
        "200":
          description: Updated currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          description: Invalid currency data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Currency not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: Search and list locations
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
    post:
      operationId: createLocation
      tags: [locations]
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid location data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A location with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /locations/{locationId}:
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateLocation
      tags: [locations]
      summary: Update or archive a location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationUpdate"
      responses:
        "200":
          description: Updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "400":
          description: Invalid location data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Search and list categories
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Categories with current spending summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get category details and spending
      responses:
        "200":
          description: Category totals, recent expenses, and monthly spending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "400":
          description: Invalid category ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories/{categoryId}/archive:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: archiveCategory
      tags: [categories]
      summary: Archive a category
      responses:
        "200":
          description: Archived category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /labels:
    get:
      operationId: listLabels
      tags: [labels]
      summary: Search and list labels
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Labels matching the search and status filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelCollection"
    post:
      operationId: createLabel
      tags: [labels]
      summary: Create a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "201":
          description: Created label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid label data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A label with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /labels/{labelId}:
    parameters:
      - name: labelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateLabel
      tags: [labels]
      summary: Update a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelUpdate"
      responses:
        "200":
          description: Updated label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid label data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A label with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /labels/{labelId}/archive:
    parameters:
      - name: labelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: archiveLabel
      tags: [labels]
      summary: Archive a label
      responses:
        "200":
          description: Archived label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid label ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: Search, filter, sort, and page through expenses
      parameters:
        - name: search
          in: query
          required: false
          description: Case-insensitive match on description, notes, category, or project name
          schema:
            type: string
            maxLength: 80
        - name: from
          in: query
          required: false
          description: Include expenses on or after this date
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: to
          in: query
          required: false
          description: Include expenses on or before this date
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: labelId
          in: query
          required: false
          description: Only expenses carrying this label
          schema:
            type: string
            format: uuid
        - name: paymentMethod
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExpensePaymentMethod"
        - name: currencyId
          in: query
          required: false
          description: Filter expenses by currency
          schema:
            type: string
            format: uuid
        - name: locationId
          in: query
          required: false
          description: Filter expenses by location
          schema:
            type: string
            format: uuid
        - name: parentCategoryId
          in: query
          required: false
          description: Filter expenses by top-level category, including all of its subcategories
          schema:
            type: string
            format: uuid
        - name: transactionType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExpenseTransactionType"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest, highest, lowest]
            default: newest
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of expenses matching the search, filters, and sort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense with related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
        "400":
          description: Invalid expense data or related record IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get an expense and its related records
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
        "400":
          description: Invalid expense ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense and its label associations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense with related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
        "400":
          description: Invalid expense data or related record IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      responses:
        "204":
          description: Expense deleted
        "400":
          description: Invalid expense ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Aggregated spending overview for the home dashboard
      description: Returns period totals, recent expenses, category and project breakdowns for the current month, and a spending trend series.
      parameters:
        - name: granularity
          in: query
          required: false
          description: Bucket size for the spending trend
          schema:
            type: string
            enum: [day, week, month]
            default: month
        - name: recentLimit
          in: query
          required: false
          description: How many recent expenses to return
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Dashboard totals, recent expenses, breakdowns, and trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /reports/period:
    get:
      operationId: getPeriodReport
      tags: [reports]
      summary: Spending report for a date range
      description: Returns totals, location/category/project/label breakdowns, and a daily spending trend for an inclusive date range.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: transactionType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExpenseTransactionType"
        - name: from
          in: query
          required: true
          description: Inclusive start date
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        - name: to
          in: query
          required: true
          description: Inclusive end date
          schema:
            type: string
            pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      responses:
        "200":
          description: Totals, breakdowns, and a daily trend for the range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodReport"
        "400":
          description: Invalid or inverted date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/locations:
    get:
      operationId: getLocationReports
      tags: [reports]
      summary: All-time spending report per location
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: Spending by location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationReportCollection"
  /reports/projects:
    get:
      operationId: getProjectReports
      tags: [reports]
      summary: Per-project spending reports
      description: Returns every project with its total spending, expense count, category breakdown, and monthly trend.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: transactionType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExpenseTransactionType"
        - name: months
          in: query
          required: false
          description: Number of trailing months to include in each monthly trend
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: A report for every project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectReportCollection"
  /reports/categories:
    get:
      operationId: getCategoryReports
      tags: [reports]
      summary: Per-category spending reports
      description: Returns every category with its total spending, expense count, project distribution, and monthly trend.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: transactionType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExpenseTransactionType"
        - name: months
          in: query
          required: false
          description: Number of trailing months to include in each monthly trend
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: A report for every category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryReportCollection"
  /reports/labels:
    get:
      operationId: getLabelReports
      tags: [reports]
      summary: Per-label spending reports
      description: Returns every label with its total spending, expense count, and monthly trend.
      parameters:
        - name: locationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: transactionType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExpenseTransactionType"
        - name: months
          in: query
          required: false
          description: Number of trailing months to include in each monthly trend
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
      responses:
        "200":
          description: A report for every label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelReportCollection"

  /export/expenses:
    get:
      operationId: exportExpensesCsv
      tags: [backup]
      summary: Export expenses as CSV
      description: Returns every expense as a comma-separated values document.
      responses:
        "200":
          description: Expenses in CSV format
          content:
            text/csv:
              schema:
                type: string
  /export/projects:
    get:
      operationId: exportProjectsCsv
      tags: [backup]
      summary: Export projects as CSV
      description: Returns every project as a comma-separated values document.
      responses:
        "200":
          description: Projects in CSV format
          content:
            text/csv:
              schema:
                type: string
  /export/categories:
    get:
      operationId: exportCategoriesCsv
      tags: [backup]
      summary: Export categories as CSV
      description: Returns every category as a comma-separated values document.
      responses:
        "200":
          description: Categories in CSV format
          content:
            text/csv:
              schema:
                type: string
  /export/labels:
    get:
      operationId: exportLabelsCsv
      tags: [backup]
      summary: Export labels as CSV
      description: Returns every label as a comma-separated values document.
      responses:
        "200":
          description: Labels in CSV format
          content:
            text/csv:
              schema:
                type: string
  /backup:
    get:
      operationId: getBackup
      tags: [backup]
      summary: Download a complete backup
      description: Returns a portable JSON document containing every project, category, label, expense, and expense-label relationship.
      responses:
        "200":
          description: A complete backup document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDocument"
  /backup/import:
    post:
      operationId: importBackup
      tags: [backup]
      summary: Import a backup
      description: Validates and merges a previously exported backup document. Existing records with matching identifiers are updated; new records are created. Nothing is deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupDocument"
      responses:
        "200":
          description: Summary of what was imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportResult"
        "400":
          description: The backup failed validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The backup conflicts with existing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  responses:
    BadRequest:
      description: The request could not be accepted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Sign in to continue
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AuthState:
      type: object
      additionalProperties: false
      required: [needsSetup, authenticated]
      properties:
        needsSetup:
          type: boolean
          description: True while the one-time account setup screen is still open.
        authenticated:
          type: boolean
          description: True when the request cookie resolves to a live session.
    AuthSession:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        email:
          type: string
          format: email
          description: Present on the setup response only.
    AuthOk:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
    GenericMessage:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            passwordChangedAt:
              type: string
              format: date-time
    SetupAccountRequest:
      type: object
      additionalProperties: false
      required: [email, password, confirmPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 200
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 200
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password, confirmPassword]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 12
          maxLength: 200
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 200
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 12
          maxLength: 200
        confirmPassword:
          type: string
          minLength: 12
          maxLength: 200
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Currency:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          minLength: 1
          maxLength: 80
        symbol:
          type: string
          minLength: 1
          maxLength: 8
        decimalPlaces:
          type: integer
          minimum: 0
          maximum: 4
        isActive:
          type: boolean
      required:
        - id
        - code
        - name
        - symbol
        - decimalPlaces
        - isActive
    CurrencyAmount:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        total:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        count:
          type: integer
          minimum: 0
        share:
          type: number
          minimum: 0
          maximum: 1
          description: Share of the matching same-currency total. Never compares across currencies.
      required:
        - currency
        - total
        - count
    CurrencyAverage:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/Currency"
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
      required:
        - currency
        - amount
    CurrencyInput:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
          pattern: "^[A-Z]{3}$"
        name:
          type: string
          minLength: 1
          maxLength: 80
        symbol:
          type: string
          minLength: 1
          maxLength: 8
        decimalPlaces:
          type: integer
          minimum: 0
          maximum: 4
        isActive:
          type: boolean
      required:
        - code
        - name
        - symbol
    CurrencyUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        symbol:
          type: string
          minLength: 1
          maxLength: 8
        decimalPlaces:
          type: integer
          minimum: 0
          maximum: 4
        isActive:
          type: boolean
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        defaultCurrency:
          $ref: "#/components/schemas/Currency"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - color
        - icon
        - status
        - defaultCurrency
        - createdAt
        - updatedAt
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type: string
          maxLength: 64
        defaultCurrencyId:
          type: string
          format: uuid
      required:
        - name
