openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project management and spending summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
      responses:
        "200":
          description: Projects with current spending totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCollection"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A project with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details and spending
      responses:
        "200":
          description: Project details with spending totals and recent expenses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A project with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}/archive:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project
      responses:
        "200":
          description: Archived project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Search and list categories
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Categories with current spending summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCategory
      tags: [categories]
      summary: Get category details and spending
      responses:
        "200":
          description: Category totals, recent expenses, and monthly spending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "400":
          description: Invalid category ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A category with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /categories/{categoryId}/archive:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: archiveCategory
      tags: [categories]
      summary: Archive a category
      responses:
        "200":
          description: Archived category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid category ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /labels:
    get:
      operationId: listLabels
      tags: [labels]
      summary: Search and list labels
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, archived, all]
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
      responses:
        "200":
          description: Labels matching the search and status filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelCollection"
    post:
      operationId: createLabel
      tags: [labels]
      summary: Create a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelInput"
      responses:
        "201":
          description: Created label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid label data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A label with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /labels/{labelId}:
    parameters:
      - name: labelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateLabel
      tags: [labels]
      summary: Update a label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelUpdate"
      responses:
        "200":
          description: Updated label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid label data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A label with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /labels/{labelId}/archive:
    parameters:
      - name: labelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: archiveLabel
      tags: [labels]
      summary: Archive a label
      responses:
        "200":
          description: Archived label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Invalid label ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses
      responses:
        "200":
          description: Expenses ordered by date, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCollection"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created expense with related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
        "400":
          description: Invalid expense data or related record IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /expenses/{expenseId}:
    parameters:
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getExpense
      tags: [expenses]
      summary: Get an expense and its related records
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
        "400":
          description: Invalid expense ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense and its label associations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated expense with related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseRecord"
        "400":
          description: Invalid expense data or related record IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      responses:
        "204":
          description: Expense deleted
        "400":
          description: Invalid expense ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type: [string, "null"]
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - color
        - icon
        - status
        - createdAt
        - updatedAt
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type: string
          maxLength: 64
      required:
        - name
    ProjectUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 4000
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        icon:
          type: [string, "null"]
          maxLength: 64
    ProjectListItem:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            totalSpent:
              type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
            expenseCount:
              type: integer
              minimum: 0
          required:
            - totalSpent
            - expenseCount
    ProjectCollection:
      type: array
      items:
        $ref: "#/components/schemas/ProjectListItem"
    ProjectCategoryBreakdown:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryColor:
          type: string
        categoryIcon:
          type: [string, "null"]
        totalSpent:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        expenseCount:
          type: integer
          minimum: 0
      required:
        - categoryId
        - categoryName
        - categoryColor
        - categoryIcon
        - totalSpent
        - expenseCount
    ProjectRecentExpense:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        description:
          type: [string, "null"]
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        categoryColor:
          type: string
        categoryIcon:
          type: [string, "null"]
        paymentMethod:
          type: [string, "null"]
          enum: [cash, credit_card, debit_card, bank_transfer, upi, other, null]
      required:
        - id
        - amount
        - date
        - description
        - categoryId
        - categoryName
        - categoryColor
        - categoryIcon
        - paymentMethod
    ProjectDetail:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        totalSpent:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        expenseCount:
          type: integer
          minimum: 0
        categoryBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ProjectCategoryBreakdown"
        recentExpenses:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRecentExpense"
      required:
        - project
        - totalSpent
        - expenseCount
        - categoryBreakdown
        - recentExpenses
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          type: [string, "null"]
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - icon
        - color
        - status
        - createdAt
        - updatedAt
    CategoryInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          type: string
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
      required:
        - name
    CategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        icon:
          type: [string, "null"]
          maxLength: 64
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
    CategoryListItem:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          properties:
            totalSpent:
              type: string
              pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
            expenseCount:
              type: integer
              minimum: 0
          required:
            - totalSpent
            - expenseCount
    CategoryCollection:
      type: array
      items:
        $ref: "#/components/schemas/CategoryListItem"
    CategoryRecentExpense:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        description:
          type: [string, "null"]
      required:
        - id
        - amount
        - date
        - description
    CategoryMonthlySpending:
      type: object
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        totalSpent:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        expenseCount:
          type: integer
          minimum: 0
      required:
        - month
        - totalSpent
        - expenseCount
    CategoryDetail:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/Category"
        totalSpent:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
        expenseCount:
          type: integer
          minimum: 0
        recentExpenses:
          type: array
          items:
            $ref: "#/components/schemas/CategoryRecentExpense"
        monthlySpending:
          type: array
          items:
            $ref: "#/components/schemas/CategoryMonthlySpending"
      required:
        - category
        - totalSpent
        - expenseCount
        - recentExpenses
        - monthlySpending
    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - status
        - createdAt
        - updatedAt
    LabelInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
      required:
        - name
    LabelUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
    LabelCollection:
      type: array
      items:
        $ref: "#/components/schemas/Label"
    ExpensePaymentMethod:
      type: string
      enum: [cash, credit_card, debit_card, bank_transfer, upi, other]
    ExpenseProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [active, archived]
      required: [id, name, color, status]
    ExpenseCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: [string, "null"]
        color:
          type: string
        status:
          type: string
          enum: [active, archived]
      required: [id, name, icon, color, status]
    ExpenseLabel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [active, archived]
      required: [id, name, color, status]
    ExpenseRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        projectId:
          type: [string, "null"]
          format: uuid
        categoryId:
          type: string
          format: uuid
        labelIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        description:
          type: [string, "null"]
        paymentMethod:
          anyOf:
            - $ref: "#/components/schemas/ExpensePaymentMethod"
            - type: "null"
        notes:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        project:
          anyOf:
            - $ref: "#/components/schemas/ExpenseProject"
            - type: "null"
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseLabel"
      required:
        - id
        - amount
        - date
        - projectId
        - categoryId
        - labelIds
        - description
        - paymentMethod
        - notes
        - createdAt
        - updatedAt
        - project
        - category
        - labels
    ExpenseCollection:
      type: array
      items:
        $ref: "#/components/schemas/ExpenseRecord"
    ExpenseInput:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          maxLength: 15
        date:
          type: string
          format: date
        projectId:
          type: [string, "null"]
          format: uuid
        categoryId:
          type: string
          format: uuid
        labelIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        description:
          type: [string, "null"]
          maxLength: 1000
        paymentMethod:
          anyOf:
            - $ref: "#/components/schemas/ExpensePaymentMethod"
            - type: "null"
        notes:
          type: [string, "null"]
          maxLength: 4000
      required: [amount, date, categoryId]
    ExpenseUpdate:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          maxLength: 15
        date:
          type: string
          format: date
        projectId:
          type: [string, "null"]
          format: uuid
        categoryId:
          type: string
          format: uuid
        labelIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        description:
          type: [string, "null"]
          maxLength: 1000
        paymentMethod:
          anyOf:
            - $ref: "#/components/schemas/ExpensePaymentMethod"
            - type: "null"
        notes:
          type: [string, "null"]
          maxLength: 4000

